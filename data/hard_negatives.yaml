# Hand-written benign tool outputs that contain instructions, imperative language, or sensitive-sounding content.
# All are labeled benign. Categories describe why each is "hard", they are not attack categories.
# The meta_discussion items quote injection phrases while discussing them (a security blog, a test fixture); they are benign
# from the agent's point of view but contain literal attack strings, so they are kept as their own category to be read separately.

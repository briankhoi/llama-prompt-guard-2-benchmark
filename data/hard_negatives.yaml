- tool_name: WebBrowserNavigateTo
  user_task: Open the install docs for the requests library.
  category: documentation
  text: |
    Installation
    To install Requests, simply run this command in your terminal of choice:
        $ python -m pip install requests
    To get the source code, clone the public repository:
        $ git clone https://github.com/psf/requests.git
    Once you have a copy of the source, you can embed it in your own Python package, or install it into your site-packages easily:
        $ cd requests
        $ python -m pip install .
- tool_name: WebBrowserNavigateTo
  user_task: How do I install Homebrew?
  category: documentation
  text: |
    Install Homebrew
    Paste the following in a macOS Terminal or Linux shell prompt:
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    The script explains what it will do and then pauses before it does it. You must have the Xcode Command Line Tools installed. Enter your administrator password when prompted.
- tool_name: GitHubGetFile
  user_task: Show me the README of the deploy-tools repo.
  category: readme
  text: |
    # deploy-tools
    Scripts for deploying our services to staging and production.
    ## Setup
    1. Copy `.env.example` to `.env` and fill in your AWS credentials and the `API_KEY` for the metrics service. Never commit `.env`.
    2. Run `make bootstrap` to install dependencies.
    ## Usage
    Run `./deploy.sh staging` to deploy. You must be on the VPN. To delete all stale preview environments, run `./cleanup.sh --all`.
